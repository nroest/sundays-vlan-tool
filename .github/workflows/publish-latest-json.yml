name: Publish latest.json

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build latest.json
        id: build
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          release = os.environ.get("GITHUB_EVENT_RELEASE", "").strip()
          data = None

          if release:
              try:
                  data = json.loads(release)
              except json.JSONDecodeError:
                  data = None

          if not data:
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/latest",
                  headers={"User-Agent": "SundaysVLANTool"}
              )
              with urllib.request.urlopen(req) as resp:
                  data = json.load(resp)

          tag = data.get("tag_name", "")
          notes = data.get("body", "")
          url = f"https://github.com/{repo}/releases/download/{tag}/SundaysVLANTool.exe"

          payload = {
              "version": tag,
              "url": url,
              "notes": notes or ""
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
        env:
          GITHUB_EVENT_RELEASE: ${{ toJson(github.event.release) }}

      - name: Publish to gh-pages
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -m "Update latest.json for ${{ github.event.release.tag_name }}"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push -f origin gh-pages
